name: DailyStreamingScraper livesportsontv

on:
  schedule:
    - cron: '25 */12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1'
          fetch-depth: 0  # Lấy toàn bộ lịch sử để rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 aiohttp
          playwright install chromium

      - name: Run script
        run: python livesportsontv.py

      - name: Pull latest changes (rebase)
        run: git pull --rebase origin 1 || true

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: update livesportsontv.json
          branch: 1
          push_options: '--force-with-lease'
