name: Scrape LiveSoccerTV

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cần cài đặt các thư viện hệ thống để Puppeteer có thể chạy Chromium
      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libappindicator3-1 libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 libgbm1 libgtk-3-0 libnspr4 libnss3 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxrandr2 xdg-utils

      - name: Install dependencies
        run: npm install puppeteer

      - name: Run scraper
        run: node scrape-livesoccertv.js

      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add livesoccertv_schedule.json
          git commit -m "Update livesoccertv schedule" || echo "No changes"
          git push
