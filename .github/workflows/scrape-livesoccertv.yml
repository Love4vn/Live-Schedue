name: Scrape LiveSoccerTV

on:
  schedule:
    - cron: "30 1 * * *"   # Chạy lúc 1:30 UTC = 8:30 VN mỗi ngày
  workflow_dispatch:       # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install axios cheerio

      - name: Run scraper
        run: node scrape-livesoccertv.js

      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add livesoccertv_schedule.json
          git commit -m "Update livesoccertv schedule" || echo "No changes"
          git push
