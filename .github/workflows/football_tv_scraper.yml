name: Premier League TV Scraper

on:
  schedule:
    - cron: '0 1 * * *'      # 8h sáng VN
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python football_tv_scraper.py

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: premier-league-tv
          path: premier_league_tv.json
