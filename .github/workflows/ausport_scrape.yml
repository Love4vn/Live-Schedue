name: Scrape Ausportguide.com (daily list)

on:
  schedule:
    - cron: "5 */12 * * *"   # setiap hari 00:05 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node src/ausport_scraper.js

      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ausport_schedule.json
          git status
          git commit -m "Update ausport_schedule.json" || echo "No changes to commit"
          git push
