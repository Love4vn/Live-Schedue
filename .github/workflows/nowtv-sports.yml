name: Fetch Now TV Sports Schedule

on:
  schedule:
    # Chạy hàng ngày lúc 08:00 UTC (tương đương 16:00 HKT)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Cho phép chạy thủ công

jobs:
  fetch-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pytz

      - name: Run script
        run: python nowtv_sports_schedule.py

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: nowtv-sports-schedule
          path: nowtv_sports_schedule.json
