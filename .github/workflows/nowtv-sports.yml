name: Fetch Now TV Sports Schedule

on:
  schedule:
    # Chạy hàng ngày lúc 08:00 UTC (tương đương 15:00 giờ Việt Nam)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Cho phép chạy thủ công từ giao diện GitHub

# Cấp quyền ghi cho GITHUB_TOKEN để có thể push code
permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz

      - name: Run Now TV sports schedule extractor
        run: python nowtv_sports_schedule_en.py

      - name: Commit and push updated JSON file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nowtv_sports_schedule_en.json
          # Chỉ commit nếu có thay đổi
          git diff --cached --quiet || git commit -m "Update Now TV sports schedule [skip ci]"
          git push
