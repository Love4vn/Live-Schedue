name: IPTV Checker

on:
  schedule:
    - cron: '30 */6 * * *'
  push:
    paths:
      - 'live_schedule.m3u'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install requests

      - name: Run IPTV checker
        run: python IPTV_checker.py live_schedule.m3u --filter-min-res 720p --output-playlist live_schedule_check.m3u

      - name: Upload filtered playlist
        uses: actions/upload-artifact@v4
        with:
          name: filtered-playlist
          path: live_schedule_check.m3u
