name: Clean M3U Playlist

on:
  push:
    paths:
      - 'live_schedule.m3u'
      - '.github/workflows/clean.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Đồng bộ local khớp hoàn toàn với remote trước khi làm gì
      - name: Sync with remote
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4          # v3 -> v4 (Node 24 ready)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Run cleaner
        run: cargo run --release

      - name: Commit cleaned playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-clean live_schedule.m3u [skip ci]"
          file_pattern: live_schedule_clean.m3u
          commit_user_name: "CXT Cleaner Bot"
          commit_user_email: "cxt-bot@users.noreply.github.com"
          branch: ${{ github.ref_name }}
          # ❌ BỎ dòng push_options --force-with-lease
