name: Update Live Football Matches

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'    # chạy mỗi 6 tiếng
  workflow_dispatch:               # chạy thủ công khi cần

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Chạy script lấy lịch bóng đá
        run: python epg_to_json.py

      - name: Commit & Push nếu có thay đổi
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_matches.json
          git commit -m "📅 Update live matches - $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
