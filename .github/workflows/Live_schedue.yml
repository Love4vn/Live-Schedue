name: Euro VN Schedule SofaScore (Chỉ hôm nay)
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install curl_cffi pycountry
      - run: python euro_vn_full_schedule_live.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update schedule.json + live_schedule.m3u (SofaScore hôm nay)"
