# .github/workflows/update-flashscore.yml
name: Update Flashscore JSON + TV Channels

on:
  #schedule:
  #  - cron: '0 * * * *'     # mỗi giờ (có thể đổi thành daily: 0 0 * * *)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright playwright-stealth

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python flash_score.py

      - name: Commit & push flashscore.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Update flashscore.json (TV channels + fixtures)"
          file_pattern: flashscore.json
