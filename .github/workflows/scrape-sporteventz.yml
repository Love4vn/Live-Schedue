name: Scrape SportEventz Schedule

on:
  schedule:
    - cron: '0 2 * * *'   # 2h UTC mỗi ngày
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Run scraper
        run: node src/sporteventz.js

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportevent-schedule
          path: sportevent_schedule.json
          retention-days: 7

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sportevent_schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update SportEventz schedule [skip ci]" && git push)
