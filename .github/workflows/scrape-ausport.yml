name: Scrape Ausport Schedule
on:
  schedule:
    - cron: '0 */6 * * *'   # chạy mỗi 6 giờ
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pytz
      - name: Run scraper
        run: python ausport_scraper.py
      - name: Commit & push JSON
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ausport_schedule.json
          git commit -m "Update ausport schedule" || echo "No changes"
          git push
